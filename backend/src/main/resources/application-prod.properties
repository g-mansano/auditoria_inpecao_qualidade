# Perfil de produção: PostgreSQL. Ative com SPRING_PROFILES_ACTIVE=prod.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/checklist}
spring.datasource.username=${DB_USUARIO:checklist}
spring.datasource.password=${DB_SENHA:troque-esta-senha}

logging.file.name=${LOG_ARQUIVO:./logs/checklist.log}
logging.logback.rollingpolicy.max-history=90
