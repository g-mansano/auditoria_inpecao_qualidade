# Perfil de demonstração pública. Ative com SPRING_PROFILES_ACTIVE=demo.
# Banco em memória: cada reinício (e o reset diário) volta aos dados de exemplo.
spring.datasource.url=jdbc:h2:mem:demo;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
# O reset diário usa Flyway clean.
spring.flyway.clean-disabled=false

app.demo.ativo=true
app.demo.senha=${DEMO_SENHA:demo1234}
app.demo.reset-cron=${DEMO_RESET_CRON:0 0 4 * * *}
app.admin-inicial.senha=${app.demo.senha}
app.armazenamento-dir=${ARMAZENAMENTO_DIR:./dados-demo/anexos}

# Instância pequena e pública: anexos menores.
spring.servlet.multipart.max-file-size=${ANEXO_MAX:8MB}
spring.servlet.multipart.max-request-size=${ANEXO_MAX:8MB}
