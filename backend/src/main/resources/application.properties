spring.application.name=checklist-auditoria
# Autenticação é feita por token próprio (TokenAuthFilter); sem usuário em memória.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# ---------------------------------------------------------------- servidor
server.port=${PORTA:8080}
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript,image/svg+xml

# HTTPS: necessário para o PWA abrir offline do zero. Em nuvem (Render, Fly...), o TLS fica no proxy da
# plataforma e isto continua desligado; num servidor próprio, informe o keystore PKCS12.
server.ssl.enabled=${SSL_ATIVO:false}
server.ssl.key-store=${SSL_KEYSTORE:}
server.ssl.key-store-password=${SSL_KEYSTORE_SENHA:}
server.ssl.key-store-type=PKCS12

# ---------------------------------------------------------------- banco
# Padrão: H2 em arquivo (desenvolvimento). Produção: perfil "prod" (PostgreSQL). Demonstração: perfil "demo".
spring.datasource.url=jdbc:h2:file:./dados/checklist;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# ---------------------------------------------------------------- uploads
spring.servlet.multipart.max-file-size=${ANEXO_MAX:50MB}
spring.servlet.multipart.max-request-size=${ANEXO_MAX:50MB}

# ---------------------------------------------------------------- aplicação
app.armazenamento-dir=${ARMAZENAMENTO_DIR:./dados/anexos}
app.token-validade-dias=30
app.extensoes-permitidas=jpg,jpeg,png,webp,gif,heic,pdf,txt,csv,doc,docx,xls,xlsx,ppt,pptx,odt,ods,mp4,mov
app.admin-inicial.username=admin
app.admin-inicial.nome=Administrador
app.admin-inicial.senha=${ADMIN_SENHA_INICIAL:trocar-esta-senha}
# Modo demonstração (ligado pelo perfil "demo"). "-" desliga o reset agendado.
app.demo.ativo=false
app.demo.reset-cron=-

# ---------------------------------------------------------------- monitoramento
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
